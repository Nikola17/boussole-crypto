# Boussole — dashboard web (lecture seule) du runner VPS.
# Fichier PUBLIC (dépôt ouvert) : aucun secret ici. Les valeurs sensibles sont des placeholders
# remplacés par setup-dashboard.sh au moment de l'installation (domaine, dossier, fichier htpasswd).
#
# Modèle de menace : le dashboard affiche l'état de la surveillance (et optionnellement la valeur
# du portefeuille si vous l'y mettez) → il est protégé par HTTPS + authentification basic.
# Ne l'exposez PAS sans auth sur une IP publique.

server {
    listen 80;
    server_name __DOMAIN__;
    # Redirection vers HTTPS (certbot ajoutera son bloc listen 443).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    root __DASHBOARD_DIR__;
    index index.html;

    # Authentification basic (fichier htpasswd créé par le script d'installation).
    auth_basic "Boussole — accès restreint";
    auth_basic_user_file /etc/nginx/.boussole-htpasswd;

    # Lecture seule : aucune méthode d'écriture, aucun autoindex, aucune exécution.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
    location = /status.json {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://__DOMAIN__" always;
    }
    # Tout le reste du système de fichiers est inaccessible.
    location ~ /\. { deny all; }

    # Sécurité : pas de négociation TLS faible.
    ssl_protocols TLSv1.2 TLSv1.3;
}
